<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primera página web</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
            color: #fff;
            font-family: Arial, sans-serif;
            background: #111;
        }

        .video-fondo {
            position: fixed;
            inset: 0;
            z-index: -2;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sombra-fondo {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: rgba(0, 0, 0, 0.4);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <video class="video-fondo" autoplay muted loop playsinline>
        <source src="assets/hsin-moon-fox-wuthering-waves-moewalls-com.mp4" type="video/mp4">
        Tu navegador no admite videos HTML5.
    </video>
    <div class="sombra-fondo"></div>

    <h1>Sistema de matricula - Error</h1>
    <p>Estamos aprendiendo control de versiones.</p>
    <h2>Tecnologías que aprenderemos</h2>
    <ul>
        <li>HTML</li>
        <li>JavaScript</li>
        <li>React</li>
    </ul>
</body>
</html>
